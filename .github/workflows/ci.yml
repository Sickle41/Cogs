name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore WarmachineAPI.sln

      - name: Build
        run: dotnet build WarmachineAPI.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test WarmachineAPI.sln --no-build --configuration Release
